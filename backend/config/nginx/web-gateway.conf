user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 10M;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream servicepilot_backend {
        zone servicepilot_backend 64k;
        server zhiying:8000 resolve;
    }

    upstream servicepilot_web {
        zone servicepilot_web 64k;
        server frontend:80 resolve;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/servicepilot/ {
            proxy_pass http://servicepilot_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location /api/zhiying/ {
            proxy_pass http://servicepilot_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location /mcp/ {
            proxy_pass http://servicepilot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        # 保留原后端接口与 Swagger 地址。
        location ~ ^/(chat|conversation|search|health|metrics|monitor|trace|knowledge|skills|eval|integrations|docs|redoc|openapi\.json)(/|$) {
            proxy_pass http://servicepilot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://servicepilot_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
