resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream servicepilot_backend {
    zone servicepilot_backend 64k;
    server zhiying-python:8000 resolve;
}

upstream servicepilot_web {
    zone servicepilot_web 64k;
    server frontend:80 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://servicepilot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/servicepilot/ {
        proxy_pass http://servicepilot_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/zhiying/ {
        proxy_pass http://servicepilot_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
