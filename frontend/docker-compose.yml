services:
  zhiying-python:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: zhiying-python
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../backend/.env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-zhiying123}
      REDIS_URL: redis://:${REDIS_PASSWORD:-zhiying123}@redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      ZHIYING_SKILLS_DIR: /app/skills
    volumes:
      - zhiying-python-data:/app/data
      - ../backend/skills:/app/skills
      - ../backend/config/mcp_servers.json:/app/config/mcp_servers.json:ro
    depends_on:
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    restart: unless-stopped
    networks:
      - zhiying-network

  redis:
    image: redis:7-alpine
    container_name: zhiying-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-zhiying123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - zhiying-network

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: zhiying-chromadb
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - zhiying-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhiying-frontend
    environment:
      PYTHON_API_URL: /api/zhiying
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      zhiying-python:
        condition: service_started
    restart: unless-stopped
    networks:
      - zhiying-network

  nginx:
    image: nginx:1.27-alpine
    container_name: zhiying-gateway
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      zhiying-python:
        condition: service_started
    restart: unless-stopped
    networks:
      - zhiying-network

networks:
  zhiying-network:
    driver: bridge

volumes:
  redis-data:
  chromadb-data:
  zhiying-python-data:
